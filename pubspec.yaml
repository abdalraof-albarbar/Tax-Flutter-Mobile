name: tax_inspector_mobile
description: Arabic-first field inspection demo based on supplied screen designs.
publish_to: 'none'
version: 0.4.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: 2.5.3
  image_picker: 1.2.0
  file_picker: 10.3.3
  qr_flutter: 4.1.0
  url_launcher: 6.3.2
  cupertino_icons: 1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
